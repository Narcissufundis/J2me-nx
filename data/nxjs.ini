; nx.js runtime configuration (pure ASCII on purpose; parsed before V8 exists)
; Crash history: stock beta.6 runtime died with Data Abort at nxjs+0x5c8430
; (stp x1,x2,[x0] in MemoryChunk ctor, called from code-page allocation, X1=0x84)
; -- same PC/LR/X1 as the mv2switch project crash. Root cause: Horizon exposes
; JIT memory as a read-only rx alias; stock switch-v8 lacks the W^X write fix.
; FIX: runtime replaced with mv2switch runtime_jitfix (switch-v8 15.0.243-9 +
; 4-byte chunk-ctor patch storing through the rw alias). With it, jit = on is
; safe (verified on-device by mv2switch) and much faster for the interpreter.

[memory]
; Max V8 heap. 2026-09-21 late: REBUILT the runtime (nx.js fork "beta6",
; built locally with devkitPro from C:/Users/Admin/Downloads/nx.js-main
; after raising the hard cap 512 -> 800 MiB in source/main.cc).
; New binary strings proof (.ro decoded):
;   "[config] memory.heap_limit not honored: above 800 MiB cap, clamped to 800 MiB"
; The backable clamp (ceiling - reserve) still applies on top of the cap.
; Empirical model from the old runtime (21 boots, 2026-09-20/21):
;   limit = min(ini, cap, ceiling - reserve); old cap 512 / reserve 180
;   good boots: limit = 512 (ceiling >= 692) / bad boots: limit = 348
;   (ceiling ~ 528). Bad boots come in runs of 2-3 and then self-heal; the
;   first boot after overnight sleep is always bad. Root cause of the low
;   ceiling still unknown -- main.js copies nxjs-debug.log (previous run's
;   [v8] mem_total/free/regime + exact ceiling/reserve) into error.log at
;   every boot to nail it down. With cap 800, bad boots land higher too
;   (reserve was also lowered in the rebuilt source), so the <400MB guard
;   should essentially never trip anymore.
; Games use only ~43MB of the V8 heap at runtime; 800 is headroom for
; bigger jars / heavier canvases, not a hard requirement.
; Accepted suffixes: KiB / MiB / GiB or raw bytes.
heap_limit = 800MiB

[v8]
; PATCHED runtime => JIT safe. Set "off" to fall back to interpreter-only
; (works with the stock runtime too, slower).
; 2026-09-23 perfH 实验：jit = **on**（V8 保留 JIT，本版只关 VM 侧 baseline JIT）。
; 目的：把"V8 jit=off 能否启动"这一个变量单独摘出来——若 perfG(jit=off) 起不来而本版能起，
; 就坐实是 V8 jit=off 的问题，与 VM 侧改动无关。
jit = on
; ---------------------------------------------------------------------------
; 2026-09-23 perfZ11（A）：wasm = on -> off，并显式写死 code_headroom_mb = 0
;
; 为什么（实机数据）：
;   wasm = on 等价于 code_headroom_mb = 64：给 WASM 额外预留 64MiB 的 JIT 代码空间。
;   但 libnx 的 jit_* 代码 arena 是**双映射**（rx+rw），source/main.cc 注释写明
;   "每 MiB 约占 2MiB 真实内存"：V8 的 64MiB 下限本身 ≈128MB 真实，再加 64MiB
;   headroom ≈ **256MB 真实**。
;   而实机启动经常是"紧档"（ceiling 被占：heap_limit=800MiB 被 clamp 到 416MB，
;   即 backable 512 - reserve 96）。512MB 授权里光代码空间就占掉一半 —— 实测死亡
;   现场正是这种紧档：V8 堆只用了 27MB 却报 "FATAL JS heap OOM at
;   CALL_AND_RETRY_LAST"（两次 Mark-Compact last resort 收不动），属于
;   "提交不到内存"，不是"堆里垃圾多"。
;
; 代价与回落：
;   * WASM 关闭 -> ADLMIDI wasm 引擎不可用，MIDI 走纯 JS 波表合成器
;     （midi-synth.js 的 beginPlaybackJS 分支，实机一直在跑，声音正常，只是音色弱些）。
;   * 换游戏时"重新求值 1.7MB bundle"会更早撞代码空间上限——那条由
;     "软重启不再重求值 bundle（只重建 VM/isolate）"根治，届时本项保持 0 即可。
; 要恢复 ADLMIDI：把下面两行改回 `wasm = on`（或 code_headroom_mb = 64），
; 但只在"正常档 limit>=700"时才划算。
wasm = off
code_headroom_mb = 0
; ---------------------------------------------------------------------------
; 2026-09-23 perfZ12：把 --expose-gc 加回来（只暴露 globalThis.gc()，不改任何行为）。
; 为什么需要：软重启的内存账本一直打 `GC=不可用`（V8 默认不给 gc()），于是"摘掉旧会话
; 全局后能不能回收"这件事只能靠 V8 自己的 GC 时机，测不了也控制不了。
; 有了它，软重启时就能主动 gc()×2 并把 used 前后写进 [session] 行。
; 语法出处：nx.js source/config.h 的示例就是 `flags = --expose-gc`
;（运行时把它追加在内建 flags 之后）。日志会打 `[config] applying app V8 flags: "--expose-gc"`。
;
; 2026-09-23 perfZ15：再加 `--stress-flush-code`。实机证据（14:10 那次）——第 4 次换游戏时
; 死在菜单扫描途中，而那一刻 used=95MB / limit=821MB（堆还剩 700MB）：耗尽的只有 **JIT 代码
; 空间**（每次软重启都把 1.7MB bundle 重新求值一遍，旧代码收不回来）。这个 flag 逼 V8 在 GC
; 时冲刷旧代码，配合 perfZ15 的"连顶层函数对象一起摘"，才有机会把代码空间还回去。
; 代价：可能让 V8 反复重编译而变慢 —— 若实测明显变卡，把这一项去掉（只留 --expose-gc）。
; 2026-09-23 perfZ16：--stress-flush-code 实测无效（甚至可能更糟：冲完又重编译，代码申请更频繁）
; → 换成**从源头少生成代码**。依据：瓶颈已钉死为 JIT 代码空间 —— 紧档 425MB 下第 2 次软重启
; 死在第 2 次 `eval j2me.js`，而那一刻堆只用了 29.8MB/425MB（富余 400MB）。每轮软重启都要为
; 1.7MB 的 bundle 重新生成代码，那就让 V8 别做激进优化：Maglev/TurboFan 的机器码量远大于 Sparkplug。
; 代价：JS 明显变慢（VM 解释器与 2D 绘制都在 JS 层）→ 很可能是"掉帧换稳定"。
; 判据：能连续换几个游戏；若帧率不能玩就退回 `flags = --expose-gc`，以 C（不重求值 bundle）为唯一解。
; 备选（比全关温和，值得对比）：`flags = --expose-gc --no-turbofan`
;   ⚠️ 2026-09-23 perfZ17 实测：这个"温和档"**反而更差** —— 保留 Maglev 时第 1 次软重启就崩，
;   而全关（perfZ16）能连换 6 次。⇒ **Maglev 才是代码空间的大头**，所以正解是全关。
; ---------------------------------------------------------------------------
; 2026-09-23 perfZ20（**用户实测否决**：--no-maglev --no-turbofan 太慢，撤回）
;   实测证据（14:46 那局）：`[present] 窗口82.9s: vm=77.9s` —— VM 解释器吃掉 94% 墙钟，
;   游戏"卡的不能玩"。虽然它把连续换游戏从 2 次抬到 6 次，但那是拿可玩性换的，**不可接受**。
;   ⇒ V8 的 JIT（含 Maglev/TurboFan）**保持默认开启**；只留 `--expose-gc`（它零运行时开销，
;      只是把 globalThis.gc() 暴露出来，正是"软重启摘全局+GC"和"扫描期回收"依赖的东西）。
;   ⇒ 结论：**代码空间那条棘轮只能靠 C 根治**（软重启不再重求值 bundle），不再用降级 JIT 换稳定。
flags = --expose-gc

[renderer]
; Skia Ganesh GPU resource cache. History: auto(512MiB) ok -> 64MiB made the
; game's loading path crawl (texture churn kept evicting cache entries) ->
; 128MiB still slower than stock on-device -> back to auto (2026-09-20 user
; report). The budget is consumed on demand (never reserved at boot), and the
; bad-boot arena issue is now handled by the <400MB exit guard in main.js,
; so the original default is safe to keep.
;
; 2026-09-23 perfZ11（B）：auto -> 256MiB。
;   实机日志：application 档下 auto 会把预算抬到 512MiB
;   （"[skia] GPU resource cache limit 256 MiB -> 512 MiB"），而紧档启动
;   （heap_limit 被 clamp 到 416MB）时它是"可让出的最大一块"。
;   历史上 64/128MiB 会让贴图密集的游戏变慢（churn 反复驱逐），所以取中间值 256：
;   紧档下先保命，正常档下仍远大于 Skia 默认 ~96MiB。
;   若实测"贴图多的游戏明显变卡"，回到 auto 即可（那就接受紧档风险）。
gpu_cache = 256

[threadpool]
; Serialize async native ops (defensive; unrelated to the code-page crash).
size = 1
